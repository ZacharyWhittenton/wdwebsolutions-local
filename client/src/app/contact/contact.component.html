  <div class="container pb-20"> <!-- Adjust the value (40px) as needed -->
    <p-card header="Contact Us" [style]="{ width: '360px' }" class="text-center mt-4">
      <ng-template pTemplate="header">
        <!-- You can optionally add an image or additional header content here -->
      </ng-template>
      <p>
        If you have any questions or inquiries, please feel free to send us an email.
      </p>
      <br>

      <p>zachw&#64;wdwebsolutions.com</p>
      <p>derekd&#64;wdwebsolutions.com</p>
      <ng-template pTemplate="footer">
        <div class="flex gap-3 mt-1">
          <button pButton type="button" label="Send Email" class="w-full custom-button" style="width: 100%;" (click)="sendEmail()"></button>
        </div>
      </ng-template>
    </p-card>
  </div>
</div>
