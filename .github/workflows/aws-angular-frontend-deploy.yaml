name: Build and Deploy Angular App to Cloudfront
on:
    push:
        branches: [ main ]
jobs:
    buld-and-deloy:
        name: Build and Deploy
        runs-on: ubuntu-latest
        env:
            BUCKET: wdwebsolutions.com
            DIST: dist/client/browser
            REGION: us-east-1
            DIST_ID: E5R6IPQNGNHV1
            WD: client/ # Working directory of project
        
        steps:
        - name: Checkout
          uses: actions/checkout@v2
      
        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v1
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.REGION }}
    
        # Uncomment and update if a specific Node version is required
        - uses: actions/setup-node@v2
        #  with:
        #    node-version: '16'
    
        - name: Install Dependencies
          run: |
            node --version
            npm ci
          working-directory: ${{ env.WD }}
    
        - name: Install Angular CLI
          run: npm install -g @angular/cli
    
        - name: Build Angular App
          run: ng build -c production
          working-directory: ${{ env.WD }}
    

        - name: Invalidate CloudFront Distribution
          run: |
            aws cloudfront create-invalidation \
              --distribution-id ${{ env.DIST_ID }} \
              --paths "/*"
        
        - name: Copy files to the production website with the AWS CLI
          run: |
            aws s3 sync --delete ${{ env.DIST }} s3://${{ env.BUCKET }}
          # Trying with admin access
          working-directory: ${{ env.WD }}
          
    
        